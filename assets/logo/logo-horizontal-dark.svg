<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60">
  <defs>
    <linearGradient id="utGoldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE8B3"/>
      <stop offset="40%" stop-color="#E5C378"/>
      <stop offset="70%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E782E"/>
    </linearGradient>
    <linearGradient id="roadLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FCE8B3"/>
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Monogram Mark: Elegant U with subtle road path curve -->
  <g transform="translate(4, 6)">
    <!-- Outer Emblem Box / Hexagon Minimal -->
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#121212" stroke="url(#utGoldGradDark)" stroke-width="1.5"/>
    
    <!-- Stylized U Letter with Highway/Road Flow Line -->
    <path d="M 14 13 L 14 27 C 14 34.5 19 38 24 38 C 29 38 34 34.5 34 27 L 34 13" 
          fill="none" 
          stroke="url(#utGoldGradDark)" 
          stroke-width="3" 
          stroke-linecap="round"/>
          
    <!-- Minimal T Bar intersecting softly -->
    <path d="M 19 20 L 29 20" 
          stroke="#FFFFFF" 
          stroke-width="2" 
          stroke-linecap="round"/>
          
    <!-- Center Guide Highway Dash -->
    <path d="M 24 23 L 24 31" 
          stroke="url(#utGoldGradDark)" 
          stroke-width="2" 
          stroke-linecap="round"
          stroke-dasharray="2 2"/>
  </g>

  <!-- Typography Block -->
  <g transform="translate(64, 14)">
    <!-- Primary Brand Word -->
    <text x="0" y="21" 
          font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" 
          font-size="20" 
          font-weight="700" 
          letter-spacing="4" 
          fill="#FFFFFF">UMAIR</text>
          
    <!-- Road Divider Line -->
    <line x1="108" y1="14" x2="236" y2="14" stroke="url(#roadLineGrad)" stroke-width="1"/>
    <circle cx="172" cy="14" r="2" fill="#FCE8B3"/>

    <!-- Subtitle: TAXI AND LIMO -->
    <text x="0" y="36" 
          font-family="'Montserrat', -apple-system, sans-serif" 
          font-size="8.5" 
          font-weight="600" 
          letter-spacing="5" 
          fill="url(#utGoldGradDark)">TAXI AND LIMO</text>
          
    <text x="144" y="36" 
          font-family="'Montserrat', -apple-system, sans-serif" 
          font-size="7" 
          font-weight="500" 
          letter-spacing="2" 
          fill="#8E94A5">&bull; YOUGHAL</text>
  </g>
</svg>